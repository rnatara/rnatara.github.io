# Featured Solace/Work Projects
featured:
  - name: "SolaceQueueBrowserWeb"
    description: "Cross-platform queue browser for Solace PubSub+ Event Brokers with desktop (Tauri), web, and Docker deployment options"
    tech_stack: [Tauri, React, TypeScript, Solace, PrimeReact, Vite]
    github_url: "https://github.com/nram-solace/SolaceQueueBrowserWeb"
    live_url: "https://solace-queue-browser-web.vercel.app/"
    status: "production"
    year: 2024

  - name: "solace-php-smf"
    description: "PHP client examples using Solace SMF (Solace Message Format) protocol"
    tech_stack: [PHP, Solace SMF]
    github_url: "https://github.com/nram-solace/solace-php-smf"
    status: "poc"
    year: 2022

  - name: "azure-pipeline-poc"
    description: "Proof-of-concept for Azure Pipeline integration with Solace broker provisioning"
    tech_stack: [Azure Pipelines, YAML, Solace]
    github_url: "https://github.com/nram-solace/azure-pipeline-poc"
    status: "poc"
    year: 2023

