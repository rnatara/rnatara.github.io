# Featured Solace/Work Projects
featured:
  - name: "SolaceQueueBrowserWeb"
    description: "Cross-platform queue browser for Solace PubSub+ Event Brokers with desktop (Tauri), web, and Docker deployment options"
    tech_stack: [Tauri, React, TypeScript, Solace, PrimeReact, Vite]
    github_url: "https://github.com/nram-solace/SolaceQueueBrowserWeb"
    live_url: "https://solace-queue-browser-web.vercel.app/"
    status: "production"
    year: 2024

  - name: "solace-agent-mesh-v0"
    description: "Open-source framework for building event-driven multi-agent AI systems with Solace event broker integration"
    tech_stack: [Python, Solace, LangChain, FastAPI, React]
    github_url: "https://github.com/nram-solace/solace-agent-mesh-v0"
    status: "production"
    year: 2024

  - name: "solace-agent-mesh-core-plugins-nram"
    description: "Official core plugins ecosystem for Solace Agent Mesh including AWS Bedrock, MongoDB, RAG, ML tools, and MCP server"
    tech_stack: [Python, AWS Bedrock, MongoDB, Scikit-learn, Pandas]
    github_url: "https://github.com/nram-solace/solace-agent-mesh-core-plugins-nram"
    status: "production"
    year: 2024

  - name: "terraform-provider-solacebroker"
    description: "Official Solace-maintained Terraform provider for configuring PubSub+ Software Event Brokers via IaC"
    tech_stack: [Go, Terraform, HashiCorp Plugin Framework, SEMPv2]
    github_url: "https://github.com/nram-solace/terraform-provider-solacebroker"
    status: "production"
    year: 2024

