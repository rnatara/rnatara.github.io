# Site settings
title: "rnatara | Developer Portfolio"
description: "Software Engineer specializing in event-driven architecture, distributed systems, and AI/ML"
author: "rnatara"
email: "rnatara@gmail.com"
baseurl: ""
url: "https://rnatara.github.io"

# Theme
remote_theme: pages-themes/hacker@v0.2.0

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Build settings
markdown: kramdown
sass:
  style: compressed
  sass_dir: _sass

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .jekyll-cache/
  - .sass-cache/

# GitHub metadata
github:
  repository_url: "https://github.com/rnatara/rnatara.github.io"

# Social links
social:
  github: "rnatara"
  linkedin: "rnatara"
